<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b18">
  <title>ECharts GL · Globe Atmosphere</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b18;
      --panel: rgba(13, 25, 48, .72);
      --line: rgba(148, 190, 255, .18);
      --text: #eaf2ff;
      --muted: #91a7c7;
      --accent: #68c8ff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 44%, rgba(18, 71, 132, .28), transparent 48%),
        radial-gradient(ellipse at 50% 100%, rgba(17, 43, 86, .3), transparent 55%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #chart { position: absolute; inset: 0; }
    .topbar {
      position: absolute; z-index: 2; top: 24px; left: 28px; right: 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      pointer-events: none;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      color: #071426; font-weight: 900;
      background: linear-gradient(135deg, #9ce7ff, #4d8cff);
      box-shadow: 0 0 28px rgba(83, 174, 255, .25);
    }
    h1 { margin: 0; font-size: clamp(15px, 2vw, 20px); letter-spacing: .02em; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .status {
      display: flex; align-items: center; gap: 8px; padding: 9px 13px;
      border: 1px solid var(--line); border-radius: 999px;
      background: rgba(9, 20, 39, .58); color: #b7c9e4; font-size: 12px;
      backdrop-filter: blur(12px);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #54e3ae; box-shadow: 0 0 12px #54e3ae; }
    .bottombar {
      position: absolute; z-index: 2; left: 28px; right: 28px; bottom: 24px;
      display: flex; align-items: end; justify-content: space-between; gap: 18px;
      pointer-events: none;
    }
    .hint, .controls {
      border: 1px solid var(--line); border-radius: 14px;
      background: var(--panel); backdrop-filter: blur(14px);
      box-shadow: 0 12px 40px rgba(0,0,0,.16);
    }
    .hint { padding: 13px 16px; max-width: 330px; }
    .hint strong { display: block; font-size: 12px; margin-bottom: 5px; }
    .hint span { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .controls { display: flex; gap: 8px; padding: 7px; pointer-events: auto; }
    button {
      appearance: none; border: 1px solid transparent; border-radius: 9px;
      padding: 9px 12px; color: var(--text); background: rgba(122, 165, 225, .1);
      font: inherit; font-size: 12px; cursor: pointer; transition: .18s ease;
    }
    button:hover { background: rgba(104, 200, 255, .18); border-color: rgba(104, 200, 255, .28); }
    button[aria-pressed="true"] { color: #08182a; background: var(--accent); }
    .credit { position: absolute; z-index: 2; right: 30px; top: 78px; color: rgba(159,185,220,.55); font-size: 10px; letter-spacing: .12em; pointer-events: none; }
    #error {
      display: none; position: absolute; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(90%, 520px); padding: 18px; border: 1px solid rgba(255,130,130,.35);
      border-radius: 14px; background: rgba(35, 12, 24, .92); color: #ffd9df; line-height: 1.6;
    }
    @media (max-width: 600px) {
      .topbar { top: 16px; left: 16px; right: 16px; align-items: flex-start; }
      .logo { width: 34px; height: 34px; }
      .status { padding: 7px 9px; font-size: 10px; }
      .bottombar { left: 16px; right: 16px; bottom: 16px; align-items: stretch; flex-direction: column; }
      .hint { max-width: none; }
      .controls { justify-content: space-between; }
      button { flex: 1; padding: 10px 6px; }
      .credit { top: 64px; right: 18px; font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="chart" role="img" aria-label="带有大气光晕的三维地球"></div>
  <header class="topbar">
    <div class="brand">
      <div class="logo">E</div>
      <div>
        <h1>EARTH · ATMOSPHERE</h1>
        <div class="subtitle">ECharts GL / 3D Visualization</div>
      </div>
    </div>
    <div class="status"><span class="dot"></span><span>3D Globe Ready</span></div>
  </header>
  <div class="credit">INTERACTIVE GLOBE · WEBGL</div>
  <footer class="bottombar">
    <div class="hint">
      <strong>探索地球</strong>
      <span>拖动旋转 · 滚轮缩放 · 使用下方按钮切换自动旋转与大气光晕。</span>
    </div>
    <div class="controls">
      <button id="rotateBtn" aria-pressed="true">暂停旋转</button>
      <button id="atmosphereBtn" aria-pressed="true">关闭光晕</button>
      <button id="resetBtn">重置视角</button>
    </div>
  </footer>
  <div id="error"></div>

  <!-- ECharts GL 2.x works with ECharts 5.x. External CDNs require outbound access from the visitor's browser. -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
  <script>
    (function () {
      const errorBox = document.getElementById('error');
      if (!window.echarts) {
        errorBox.style.display = 'block';
        errorBox.textContent = 'ECharts 加载失败。请检查浏览器网络或 CDN 可用性，然后刷新页面。';
        return;
      }

      const chart = echarts.init(document.getElementById('chart'));
      let rotating = true;
      let atmosphere = true;

      const option = {
        backgroundColor: 'transparent',
        globe: {
          // Earth texture used by the official ECharts GL globe-atmosphere example.
          baseTexture: './assets/world.topo.bathy.200401.jpg',
          heightTexture: './assets/world.topo.bathy.200401.jpg',
          displacementScale: 0.04,
          shading: 'lambert',
          environment: 'auto',
          light: {
            ambient: { intensity: 0.55 },
            main: { intensity: 1.15, shadow: false },
            ambientCubemap: { diffuseIntensity: 0.2 }
          },
          viewControl: {
            autoRotate: rotating,
            autoRotateSpeed: 5,
            autoRotateAfterStill: 3,
            damping: 0.8,
            rotateSensitivity: 1,
            zoomSensitivity: 1,
            minDistance: 100,
            maxDistance: 300
          },
          postEffect: { enable: false },
          atmosphere: {
            show: atmosphere,
            color: '#66baff',
            offset: 5,
            glowPower: 8,
            innerGlowPower: 4
          }
        },
        series: []
      };

      chart.setOption(option);

      document.getElementById('rotateBtn').addEventListener('click', function () {
        rotating = !rotating;
        chart.setOption({ globe: { viewControl: { autoRotate: rotating } } });
        this.textContent = rotating ? '暂停旋转' : '开始旋转';
        this.setAttribute('aria-pressed', String(rotating));
      });

      document.getElementById('atmosphereBtn').addEventListener('click', function () {
        atmosphere = !atmosphere;
        chart.setOption({ globe: { atmosphere: { show: atmosphere } } });
        this.textContent = atmosphere ? '关闭光晕' : '开启光晕';
        this.setAttribute('aria-pressed', String(atmosphere));
      });

      document.getElementById('resetBtn').addEventListener('click', function () {
        chart.setOption({
          globe: {
            viewControl: {
              alpha: 20,
              beta: 0,
              distance: 200,
              autoRotate: rotating
            }
          }
        });
      });

      window.addEventListener('resize', function () { chart.resize(); });
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') {
          errorBox.style.display = 'block';
          errorBox.textContent = '图表依赖加载失败，请检查 CDN 访问情况。';
        }
      }, true);
    })();
  </script>
</body>
</html>
